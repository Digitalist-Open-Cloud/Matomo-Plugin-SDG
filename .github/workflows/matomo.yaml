name: Test plugin with Matomo

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches: ["5.x-dev"]
jobs:
  PluginTests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
        target: ['minimum_required_matomo', 'maximum_supported_matomo']
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Run tests
        env:
          # Every job that has the key sends a transfer to the acceptance portal, so only one gets it.
          SDG_ACCEPTANCE_API_KEY: ${{ matrix.php == '8.4' && matrix.target == 'maximum_supported_matomo' && secrets.SDG_ACCEPTANCE_API_KEY || '' }}
          SDG_ACCEPTANCE_URL: ${{ vars.SDG_ACCEPTANCE_URL || secrets.SDG_ACCEPTANCE_URL }}
        uses: Digitalist-Open-Cloud/Matomo-github-action-tests@main
        with:
          plugin-name: 'SDG'
          php-version: ${{ matrix.php }}
          test-type: 'PluginTests'
          matomo-test-branch: ${{ matrix.target }}
